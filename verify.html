<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vérification — MOTSA</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0f0f0f;--ink2:#4a4a4a;--ink3:#888;--ink4:#bbb;--line:#e6e6e4;--bg:#f7f6f3;--w:#fff;--g:#1a7a4a;--gbg:#eef8f2;--gbr:rgba(26,122,74,.18);--r:#991b1b;--rbg:#fff3f3;--rbr:#fecaca}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--ink);font-family:'Geist',sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
    nav{background:rgba(247,246,243,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:0 6%;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
    .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px;letter-spacing:.04em}
    .lm{width:22px;height:22px;border-radius:6px;background:var(--ink);display:flex;align-items:center;justify-content:center}.lm svg{width:12px;height:12px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;text-decoration:none;transition:all .12s;border:1px solid var(--line);font-family:'Geist',sans-serif;background:var(--w);color:var(--ink2)}
    .btn:hover{background:var(--bg);color:var(--ink)}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 6%}
    .card{background:var(--w);border:1px solid var(--line);border-radius:18px;padding:42px 40px;width:100%;max-width:680px;box-shadow:0 4px 40px rgba(0,0,0,.06)}
    .kicker{display:inline-flex;align-items:center;gap:7px;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--g);text-transform:uppercase;margin-bottom:18px}.kd{width:6px;height:6px;border-radius:50%;background:var(--g)}
    h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:34px;line-height:1.1;margin-bottom:10px} .lead{color:var(--ink2);font-weight:300;margin-bottom:28px;max-width:560px}
    .token-pill{display:none;margin-bottom:22px;font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3);background:var(--bg);border:1px solid var(--line);padding:8px 11px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .upload{border:1.5px dashed var(--line);border-radius:14px;padding:34px 26px;text-align:center;cursor:pointer;transition:all .15s;background:#fff}
    .upload:hover{border-color:#bbb;background:var(--bg)} .upload strong{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}.upload span{font-size:13px;color:var(--ink3)} input[type=file]{display:none}
    .state{display:none;margin-top:24px}.state.on{display:block}.loading{padding:20px;text-align:center;color:var(--ink3)}.spinner{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .75s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
    .result{border-radius:14px;padding:24px;border:1px solid var(--line)}.result.ok{background:var(--gbg);border-color:var(--gbr)}.result.err{background:var(--rbg);border-color:var(--rbr)}
    .rhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}.ricon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}.ok .ricon{background:var(--g);color:#fff}.err .ricon{background:var(--r);color:#fff}
    .rtitle{font-size:18px;font-weight:500;color:var(--ink);margin-bottom:2px}.rmsg{font-size:14px;color:var(--ink2);font-weight:300}
    .rows{background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:10px;overflow:hidden}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}.row:last-child{border:none}.rk{color:var(--ink3);font-size:13px;white-space:nowrap}.rv{font-weight:500;font-size:13px;text-align:right;word-break:break-word;color:var(--ink)}
    .hash{margin-top:16px;font-family:'Geist Mono',monospace;font-size:11px;word-break:break-all;color:var(--ink3);background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions a{font-size:13px;color:var(--ink);text-decoration:none;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:8px}
    footer{border-top:1px solid var(--line);padding:20px 6%;background:var(--w);text-align:center}footer p{font-size:13px;color:var(--ink4)}footer a{color:var(--ink3);text-decoration:none}
    @media(max-width:720px){.card{padding:30px 22px}.row{flex-direction:column;gap:2px}.rv{text-align:left}h1{font-size:30px}}
  </style>
</head>
<body>
<nav>
  <a class="logo" href="/">
    <div class="lm"><svg viewBox="0 0 12 12" fill="none"><path d="M2 3h8M2 6h5M2 9h7" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg></div>
    MOTSA
  </a>
  <a class="btn" href="/">Retour</a>
</nav>
<main>
  <div class="card">
    <div class="kicker"><span class="kd"></span>Vérification publique</div>
    <h1>Vérifier l’authenticité d’un document</h1>
    <p class="lead">Déposez le PDF certifié MOTSA. Le serveur calcule son empreinte SHA-256 et la compare au certificat enregistré.</p>
    <div class="token-pill" id="tokenPill"></div>
    <label for="fileCheck">
      <div class="upload" id="dropZone">
        <strong>Déposer le PDF certifié ici</strong>
        <span>ou cliquer pour sélectionner un fichier PDF</span>
      </div>
    </label>
    <input type="file" id="fileCheck" accept="application/pdf" onchange="verifyFile(this.files[0])"/>
    <div class="state" id="loading"><div class="loading"><div class="spinner"></div>Vérification du hash...</div></div>
    <div class="state" id="result"></div>
  </div>
</main>
<footer><p>© 2026 <a href="/">MOTSA</a> — Document provenance & integrity platform</p></footer>
<script>
const API_URL = 'http://localhost:5001'; // Alpha locale. En production : remplacer par l'URL du serveur MOTSA Cloud.
const token = new URLSearchParams(location.search).get('token') || '';

if (token) {
  const pill = document.getElementById('tokenPill');
  pill.style.display = 'block';
  pill.textContent = 'Certificat détecté · token ' + token;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(v){ if(!v) return '—'; try { return new Date(v).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); } catch { return v; } }
function sourceHost(v){ try { return new URL(v||'').hostname || '—'; } catch { return '—'; } }
function showLoading(on){ document.getElementById('loading').classList.toggle('on', !!on); }

async function verifyFile(file) {
  if (!file) return;
  document.getElementById('dropZone').querySelector('strong').textContent = file.name;
  document.getElementById('result').className = 'state';
  document.getElementById('result').innerHTML = '';
  showLoading(true);

  const fd = new FormData();
  fd.append('file', file);
  if (token) fd.append('token', token);

  try {
    const r = await fetch(API_URL + '/verify-upload', { method:'POST', body: fd });
    const data = await r.json();
    renderResult(data);
  } catch (e) {
    renderResult({ok:false,status:'network_error',message:"Impossible de joindre le serveur de vérification MOTSA.", uploaded_hash:'—'});
  } finally {
    showLoading(false);
  }
}

function renderResult(data) {
  const ok = data.ok === true;
  const doc = data.document || {};
  const profile = data.profile || {};
  const cert = data.certificate || {};
  const result = document.getElementById('result');
  result.className = 'state on';

  if (ok) {
    result.innerHTML = `
      <div class="result ok">
        <div class="rhead"><div class="ricon">✓</div><div><div class="rtitle">Document authentique</div><div class="rmsg">${esc(data.message || `Ce document n’a pas été modifié depuis son téléchargement depuis ${sourceHost(doc.source_url)}.`)}</div></div></div>
        <div class="rows">
          <div class="row"><span class="rk">Document</span><span class="rv">${esc(doc.file_name || '—')}</span></div>
          <div class="row"><span class="rk">Titulaire</span><span class="rv">${esc(profile.full_name || '—')}</span></div>
          <div class="row"><span class="rk">Source d’origine</span><span class="rv">${esc(sourceHost(doc.source_url))}</span></div>
          <div class="row"><span class="rk">Date de certification</span><span class="rv">${esc(fmtDate(cert.created_at || doc.created_at))}</span></div>
          <div class="row"><span class="rk">Statut</span><span class="rv">Certifié par MOTSA</span></div>
        </div>
        <div class="hash"><strong>SHA-256 vérifié</strong><br>${esc(data.uploaded_hash || '')}</div>
        <div class="actions">${doc.file_url ? `<a href="${esc(doc.file_url)}" target="_blank">Télécharger le PDF certifié</a>` : ''}</div>
      </div>`;
    return;
  }

  result.innerHTML = `
    <div class="result err">
      <div class="rhead"><div class="ricon">✕</div><div><div class="rtitle">Document probablement modifié</div><div class="rmsg">${esc(data.message || "Le hash du fichier ne correspond pas au certificat MOTSA. Le document a peut-être été modifié après sa certification.")}</div></div></div>
      <div class="hash"><strong>Hash du fichier uploadé</strong><br>${esc(data.uploaded_hash || '—')}${data.expected_hash ? `<br><br><strong>Hash attendu</strong><br>${esc(data.expected_hash)}` : ''}</div>
    </div>`;
}

// Drag & drop
const dz = document.getElementById('dropZone');
['dragenter','dragover'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.style.background = 'var(--bg)'; }));
['dragleave','drop'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.style.background = '#fff'; }));
dz.addEventListener('drop', e => verifyFile(e.dataTransfer.files[0]));
</script>
</body>
</html>
